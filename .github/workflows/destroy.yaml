name: Destroy all Jitsi Resources on AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        type: string

jobs:
  destroy-resources-on-aws:
    runs-on: ubuntu-latest

    env:
      TF_ENV: ${{ inputs.environment }}
      AWS_REGION: eu-central-1

    steps:
      - name: Validate destroy confirmation
        run: |
          if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "Destroy confirmation failed. Type DESTROY to proceed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Resolve Terraform files
        id: tf_files
        run: |
          BACKEND_CONFIG_FILE="backendfiles/backend.${TF_ENV}.conf"
          TFVARS_FILE="envs/${TF_ENV}.tfvars"

          if [[ ! -f "${BACKEND_CONFIG_FILE}" ]]; then
            echo "Backend config file not found: ${BACKEND_CONFIG_FILE}"
            exit 1
          fi

          if [[ ! -f "${TFVARS_FILE}" ]]; then
            echo "tfvars file not found: ${TFVARS_FILE}"
            exit 1
          fi

          echo "backend_config_file=${BACKEND_CONFIG_FILE}" >> "$GITHUB_OUTPUT"
          echo "tfvars_file=${TFVARS_FILE}" >> "$GITHUB_OUTPUT"

      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: eu
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BITWARDEN_AWS_ACCESS_KEY_ID_UUID }} > AWS_ACCESS_KEY_ID
            ${{ vars.BITWARDEN_AWS_SECRET_ACCESS_KEY_UUID }} > AWS_SECRET_ACCESS_KEY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ steps.secrets.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.secrets.outputs.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="${{ steps.tf_files.outputs.backend_config_file }}"

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy \
            -var-file="${{ steps.tf_files.outputs.tfvars_file }}"

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var-file="${{ steps.tf_files.outputs.tfvars_file }}"