name: Deploy Backend
description: Deploy Jitsi AWS resources for backend and configure Cloudflare resources for backend
on: 
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - live
        default: dev

concurrency:
  group: jitsi-backend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-jitsi-backend-and-configure-cloudflare:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ inputs.environment }}
      TF_LOG: ${{ vars.TF_LOG_LEVEL }}
      
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Checkout repository
        uses: actions/checkout@v4

      # Fetchig secrets from Bitwarden
      - name: Get Secrets
        id: core_secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_TOAB_JITSI_TERRAFORM_PROVISIONER_ACCESS_KEY_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.BITWARDEN_UUID_TOAB_JITSI_TERRAFORM_PROVISIONER_SECRET_ACCESS_KEY }} > AWS_SECRET_ACCESS_KEY
            ${{ vars.BITWARDEN_UUID_CLOUDFLARE_USER_API_TOKEN_TOAB_JITSI_WEB }} > CLOUDFLARE_API_TOKEN
            ${{ vars.BITWARDEN_UUID_MODERATOR_SERVICE_DB_PASSWORD }} > MODERATOR_SERVICE_DB_PASSWORD
            ${{ vars.BITWARDEN_UUID_AIVEN_DB_HOST }} > AIVEN_DB_HOST
            ${{ vars.BITWARDEN_UUID_MODERATOR_SERVICE_DB_USERNAME }} > MODERATOR_SERVICE_DB_USERNAME
          set_env: true
        
        # Fetchig secrets from Bitwarden for aiven ping service separately
      - name: Get Secrets for Aiven ping service
        if: inputs.environment == 'dev'
        id: aiven_secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_AIVEN_SERVICE_DB_PASSWORD }} > AIVEN_SERVICE_DB_PASSWORD
            ${{ vars.BITWARDEN_UUID_AIVEN_SERVICE_DB_USERNAME }} > AIVEN_SERVICE_DB_USERNAME
          set_env: true

        # moderator db credentials passed as json file
      - name: Generate Shared Variables
        run: |
          cat << EOF > stacks/aws-backend/moderator.auto.tfvars.json
          {
            "moderator_db_config": {
              "username": "${{ env.MODERATOR_SERVICE_DB_USERNAME }}",
              "password": "${{ env.MODERATOR_SERVICE_DB_PASSWORD }}",
              "schema": "jitsi_moderator",
              "db_name": "toab-jitsi-${{ inputs.environment }}",
              "host": "$(echo "${{ env.AIVEN_DB_HOST }}" | cut -d':' -f1)",
              "port": "$(echo "${{ env.AIVEN_DB_HOST }}" | cut -d':' -f2)"
            }
          }
          EOF
          
      # aiven service db credentials
      - name: Generate Aiven Ping Service Variables (Dev)
        if: inputs.environment == 'dev'
        run: |
          cat << EOF > stacks/aws-backend/ping.auto.tfvars.json
          {
            "aiven_ping_db_config": {
              "username": "${{ env.AIVEN_SERVICE_DB_USERNAME }}",
              "password": "${{ env.AIVEN_SERVICE_DB_PASSWORD }}",
              "url": "jdbc:postgresql://${{ env.AIVEN_DB_HOST }}/defaultdb?sslmode=require&currentSchema=jitsi_aiven_ping"
            }
          }
          EOF

      - name: Get Outlook Graph secrets from Bitwarden
        id: outlook_graph_secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_OUTLOOK_GRAPH_CLIENT_ID }} > OUTLOOK_GRAPH_CLIENT_ID
            ${{ vars.BITWARDEN_UUID_OUTLOOK_GRAPH_CLIENT_SECRET }} > OUTLOOK_GRAPH_CLIENT_SECRET
            ${{ vars.BITWARDEN_UUID_OUTLOOK_GRAPH_TOKEN_ENCRYPTION_KEY }} > OUTLOOK_GRAPH_TOKEN_ENCRYPTION_KEY
          set_env: true

      - name: Generate Outlook Graph renewal variables
        run: |
          cat << EOF > stacks/aws-backend/outlook-graph-renewal.auto.tfvars.json
          {
            "outlook_graph_renewal_config": {
              "client_id": "${{ env.OUTLOOK_GRAPH_CLIENT_ID }}",
              "client_secret": "${{ env.OUTLOOK_GRAPH_CLIENT_SECRET }}",
              "tenant": "${{ vars.OUTLOOK_GRAPH_TENANT }}",
              "redirect_uri": "${{ vars.OUTLOOK_GRAPH_REDIRECT_URI }}",
              "public_base_url": "${{ vars.OUTLOOK_GRAPH_PUBLIC_BASE_URL }}",
              "token_encryption_key": "${{ env.OUTLOOK_GRAPH_TOKEN_ENCRYPTION_KEY }}",
              "scopes": "${{ vars.OUTLOOK_GRAPH_SCOPES }}"
            }
          }
          EOF

      # AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}

      # AWS Terraform Execution, target only backend resources
      - name: Initialize AWS Terraform -- target only backend resources
        run: |
          terraform -chdir=stacks/aws-backend init \
            -reconfigure \
            -backend-config="../../backendfiles/aws-backend/backend.${TF_ENV}.conf"

      - name: Plan AWS Terraform -- target only backend resources
        run: |
          terraform -chdir=stacks/aws-backend plan \
            -var-file="../../envs/aws-backend/${TF_ENV}.tfvars" \
            -target='module.jitsi_backend[0]' \
            -out=tfplan

      - name: Apply AWS Terraform
        run: |
          terraform -chdir=stacks/aws-backend apply -auto-approve tfplan

      # Cloudflare Terraform Execution, target only backend resources
      - name: Initialize Cloudflare Terraform -- target only backend resources
        run: |
          terraform -chdir=stacks/cloudflare-backend init \
            -reconfigure \
            -backend-config="../../backendfiles/cloudflare-backend/backend.${TF_ENV}.conf"

      - name: Plan Cloudflare Terraform -- target only backend resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=stacks/cloudflare-backend plan \
            -var-file="../../envs/cloudflare-backend/${TF_ENV}.tfvars" \
            -out=tfplan

      - name: Apply Cloudflare Terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=stacks/cloudflare-backend apply -auto-approve tfplan

