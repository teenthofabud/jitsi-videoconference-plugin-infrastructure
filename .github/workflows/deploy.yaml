name: Deploy Jitsi AWS resources for the static website and configure Cloudflare resources

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

jobs:
  deploy-to-aws:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ inputs.environment }}
      TF_LOG: ${{ vars.TF_LOG_LEVEL }}
      
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Checkout repository
        uses: actions/checkout@v4

      # Resolve the tfvars and backendfiles first
      - name: Resolve Terraform files
        id: tf_files
        run: |
          AWS_BACKEND_CONFIG_FILE="backendfiles/aws/backend.${TF_ENV}.conf"
          AWS_TFVARS_FILE="envs/aws/${TF_ENV}.tfvars"
          CLOUDFLARE_BACKEND_CONFIG_FILE="backendfiles/cloudflare/backend.${TF_ENV}.conf"
          CLOUDFLARE_TFVARS_FILE="envs/cloudflare/${TF_ENV}.tfvars"

          for FILE in \
            "$AWS_BACKEND_CONFIG_FILE" \
            "$AWS_TFVARS_FILE" \
            "$CLOUDFLARE_BACKEND_CONFIG_FILE" \
            "$CLOUDFLARE_TFVARS_FILE"
          do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Terraform file not found: $FILE"
              exit 1
            fi
          done

          echo "aws_backend_config_file=$AWS_BACKEND_CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "aws_tfvars_file=$AWS_TFVARS_FILE" >> "$GITHUB_OUTPUT"
          echo "cloudflare_backend_config_file=$CLOUDFLARE_BACKEND_CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "cloudflare_tfvars_file=$CLOUDFLARE_TFVARS_FILE" >> "$GITHUB_OUTPUT" 

      # Fetchig secrets from Bitwarden
      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_SECRET_UUID_TOAB_JITSI_TERRAFORM_PROVISIONER_ACCESS_KEY_ID }} > AWS_ACCESS_KEY_ID
            ${{ vars.BITWARDEN_SECRET_UUID_TOAB_JITSI_TERRAFORM_PROVISIONER_SECRET_ACCESS_KEY }} > AWS_SECRET_ACCESS_KEY
            ${{ vars.BITWARDEN_SECRET_UUID_CLOUDFLARE_USER_API_TOKEN_TOAB_JITSI_WEB }} > CLOUDFLARE_API_TOKEN

      # AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ steps.secrets.outputs.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ steps.secrets.outputs.AWS_SECRET_ACCESS_KEY }}

      # AWS Terraform Execution
      - name: Initialize AWS Terraform
        run: |
          terraform -chdir=stacks/aws init \
            -reconfigure \
            -backend-config="../../${{ steps.tf_files.outputs.aws_backend_config_file }}"

      - name: Plan AWS Terraform
        run: |
          terraform -chdir=stacks/aws plan \
            -var-file="../../${{ steps.tf_files.outputs.aws_tfvars_file }}" \
            -out=tfplan

      - name: Apply AWS Terraform
        run: |
          terraform -chdir=stacks/aws apply -auto-approve tfplan

      # Cloudflare Terraform Execution
      - name: Initialize Cloudflare Terraform
        run: |
          terraform -chdir=stacks/cloudflare init \
            -reconfigure \
            -backend-config="../../${{ steps.tf_files.outputs.cloudflare_backend_config_file }}"

      - name: Plan Cloudflare Terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=stacks/cloudflare plan \
            -var-file="../../${{ steps.tf_files.outputs.cloudflare_tfvars_file }}" \
            -out=tfplan

      - name: Apply Cloudflare Terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=stacks/cloudflare apply -auto-approve tfplan
          