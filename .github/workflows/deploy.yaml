- name: Get Secrets
  id: secrets
  uses: bitwarden/sm-action@v3
  with:
    access_token: ${{ secrets.SM_ACCESS_TOKEN }}
    secrets: |
      e34f178e-c389-426a-8628-b46100ea531c > AWS_ACCESS_KEY_ID
      9463a0e5-4e80-43ba-8c9e-b46100ea7ce7 > AWS_SECRET_ACCESS_KEY

- name: test bitwarden
  run: |
    echo "key id : ${{ steps.secrets.AWS_ACCESS_KEY_ID }}"
    echo "secret key : ${{ steps.secrets.AWS_SECRET_ACCESS_KEY }}"
