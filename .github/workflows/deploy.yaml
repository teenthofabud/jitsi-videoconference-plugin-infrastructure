name: Deploy Jitsi Resources to AWS

on: 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: eu
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: |
            50e6adcc-e0a1-4bb0-8755-b469008d3c46 > TEST_A
            7b1bd0bb-ddac-40a8-a426-b469008d5288 > TEST_B

      - name: test bitwarden
        run: |
          echo "key id : ${{ steps.secrets.outputs.TEST_A }}"
          echo "secret key : ${{ steps.secrets.outputs.TEST_B }}"
