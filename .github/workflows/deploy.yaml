name: Deploy Jitsi Resources to AWS

on: 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Get Secrets
        id: secrets
        cloud_region: eu
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: |
            63fca68c-453f-4a5f-886e-b461011893a7 > TEST_A
            eb0c8662-aefd-40f3-bc91-b4610118780d > TEST_B

      - name: test bitwarden
        run: |
          echo "key id : ${{ steps.secrets.outputs.TEST_A }}"
          echo "secret key : ${{ steps.secrets.outputs.TEST_B }}"
